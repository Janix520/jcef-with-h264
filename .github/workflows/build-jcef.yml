name: Build java-cef

on:
  push:
    branches:
      - master
    tags:
      - 'v*'  
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # jcef.jar 是纯 Java 产物，与平台无关，只编一次。
  # CMake/ninja 只负责 native（libjcef / jcef_helper / macOS app bundle），
  # 在 Linux/Windows 上必须由 tools/compile.* + tools/make_jar.* 单独生成 jar。
  # ---------------------------------------------------------------------------
  jcef-jar:
    name: Build jcef.jar (platform independent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      # org/cef/browser/CefRenderer.java 和 CefBrowserOsr.java 依赖 com.jogamp。
      # 仓库里 third_party/jogamp/jar/ 是空目录（只有 README + LICENSE），必须先补齐。
      # 注意：jogamp 2.4.0 起不再发布到 Maven Central，只在其官方仓库，
      # 所以不要用 repo1.maven.org 的坐标。
      - name: Download jogamp jars
        run: |
          set -e
          mkdir -p third_party/jogamp/jar
          BASE="https://jogamp.org/deployment/v2.4.0/jar"
          ALT="https://jogamp.org/deployment/archive/rc/v2.4.0/jar"
          for f in jogl-all.jar gluegen-rt.jar; do
            curl -fsSL --retry 3 --retry-delay 5 -o "third_party/jogamp/jar/$f" "$BASE/$f" \
              || curl -fsSL --retry 3 --retry-delay 5 -o "third_party/jogamp/jar/$f" "$ALT/$f"
          done
          ls -lh third_party/jogamp/jar

      - name: Compile java classes and make jar
        run: |
          set -e
          cd tools
          # 参数只是决定 out/<platform> 目录名，jar 本身不含平台相关代码
          ./compile.sh linux64
          ./make_jar.sh linux64
          mkdir -p ../jcef-jar-out
          cp ../out/linux64/jcef.jar ../out/linux64/jcef-tests.jar ../jcef-jar-out/
          cd ../jcef-jar-out
          unzip -l jcef.jar | head -20
          test -n "$(unzip -Z1 jcef.jar 'org/cef/CefApp.class')" || { echo "jcef.jar 缺少 org/cef 类"; exit 1; }
          ls -lh

      - name: Upload jcef.jar
        uses: actions/upload-artifact@v4
        with:
          name: jcef-jar
          path: jcef-jar-out/*.jar
          
  java-cef-linux:
    runs-on: [ubuntu-22.04]
    strategy:
      matrix:
        platform: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Install deps and build
        run: |
          sudo apt update
          sudo apt install build-essential g++ cmake ninja-build python3 libgtk2.0-dev -y
          mkdir jcef_build && cd jcef_build
          export CEF_USE_GN=1
          export GN_DEFINES="is_official_build=true proprietary_codecs=true ffmpeg_branding=Chrome"
          cmake -G "Ninja" -DPROJECT_ARCH=${{ matrix.platform }} -DCMAKE_BUILD_TYPE=Release ..
          ninja -j4
          mv native/Release linux_${{ matrix.platform }}
          strip linux_${{ matrix.platform }}/libcef.so
          tar -czf linux_${{ matrix.platform }}.tar.gz linux_${{ matrix.platform }}
          sha256sum linux_${{ matrix.platform }}.tar.gz > linux_${{ matrix.platform }}.tar.gz.sha256
      - name: Upload java-cef build
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.platform }}-build
          path: jcef_build/linux_${{ matrix.platform }}.tar.gz
  java-cef-windows:
    runs-on: [windows-2022]
    strategy:
      matrix:
        platform: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        run: |
          mkdir jcef_build && cd jcef_build
          $env:CEF_USE_GN = "1"
          $env:GN_DEFINES = "is_official_build=true proprietary_codecs=true ffmpeg_branding=Chrome"
          cmake -G "Ninja" -DPROJECT_ARCH=${{ matrix.platform }} -DCMAKE_BUILD_TYPE=Release ..
          ninja -j4
          cd native
          ren Release windows_${{ matrix.platform }}
          cd ..
          move native/windows_${{ matrix.platform }} windows_${{ matrix.platform }}
          tar -czf windows_${{ matrix.platform }}.tar.gz windows_${{ matrix.platform }}
          Get-FileHash -Algorithm SHA256 -Path "windows_${{ matrix.platform }}.tar.gz" | Out-File "windows_${{ matrix.platform }}.tar.gz.sha256"
      - name: Upload java-cef build
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.platform }}-build
          path: jcef_build/windows_${{ matrix.platform }}.tar.gz
  java-cef-macos:
    runs-on: macos-15
    strategy:
      matrix:
        platform: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'zulu'

      # 关键：buildtools 自带的 gsutil 5.30 不支持 Python 3.12+，
      # 镜像默认 3.14 会让它崩在 EnumDefinitionError
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: |
          brew install ninja ant
          xcodebuild -version
          python3 --version
          export PYTHON_EXECUTABLE="$(command -v python3)"
          echo "PYTHON_EXECUTABLE=$PYTHON_EXECUTABLE"
          mkdir jcef_build && cd jcef_build
          export CEF_USE_GN=1
          export GN_DEFINES="is_official_build=true proprietary_codecs=true ffmpeg_branding=Chrome"
          cmake -G "Ninja" -DPROJECT_ARCH=${{ matrix.platform }} -DCMAKE_BUILD_TYPE=Release ..
          ninja -j$(sysctl -n hw.ncpu)
          mv native/Release macos_${{ matrix.platform }}
          tar -czf macos_${{ matrix.platform }}.tar.gz macos_${{ matrix.platform }}
          shasum -a 256 macos_${{ matrix.platform }}.tar.gz > macos_${{ matrix.platform }}.tar.gz.sha256
      - name: Upload java-cef build
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.platform }}-build
          path: |
            jcef_build/macos_${{ matrix.platform }}.tar.gz
            jcef_build/macos_${{ matrix.platform }}.tar.gz.sha256

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - jcef-jar
      - java-cef-linux
      - java-cef-windows
      - java-cef-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' -o -name '*.jar'\) -exec mv {} dist/ \;
          cd dist && sha256sum jcef.jar > jcef.jar.sha256 && cd ..
          ls -lh dist

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.jar
          generate_release_notes: true
          draft: true
